name: Release Jellyfin plugin
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version with four numeric components, e.g. 0.2.0.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: jellyfin-plugin-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Validate release tag
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Tags must be v1.2.3.4, or use workflow_dispatch with 1.2.3.4' >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore and publish
        run: |
          dotnet restore Jellyfin.SubscriptionManager/Jellyfin.SubscriptionManager.csproj
          dotnet publish Jellyfin.SubscriptionManager/Jellyfin.SubscriptionManager.csproj -c Release --no-restore \
            -p:Version="${{ steps.version.outputs.version }}" -o "${RUNNER_TEMP}/sm-publish"

      - name: Package DLL and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist "${RUNNER_TEMP}/sm-package"
          cp "${RUNNER_TEMP}/sm-publish/Jellyfin.Plugin.SubscriptionManager.dll" "${RUNNER_TEMP}/sm-package/"
          # Embedded HTML/JS are already compiled into the DLL.
          (cd "${RUNNER_TEMP}/sm-package" && zip -9 -q "${GITHUB_WORKSPACE}/dist/SubscriptionManager_v${{ steps.version.outputs.version }}.zip" ./*.dll)
          (cd dist && sha256sum ./*.zip > SHA256SUMS)
          (cd "${RUNNER_TEMP}/sm-package" && sha256sum Jellyfin.Plugin.SubscriptionManager.dll > "${GITHUB_WORKSPACE}/dist/DLL_SHA256SUMS")
          # Jellyfin's manifest checksum is MD5; the SHA256 file is an additional integrity check.

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            dist/*.zip dist/SHA256SUMS dist/DLL_SHA256SUMS \
            --title "Subscription Manager ${{ steps.version.outputs.version }}" \
            --generate-notes --verify-tag
        # workflow_dispatch requires the tag to already exist. For a first release:
        # git tag v0.2.0.0 && git push origin v0.2.0.0

      - name: Check out catalog manifest from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: catalog
          persist-credentials: true

      - name: Update Jellyfin plugin catalog
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 scripts/update_manifest.py \
            --manifest catalog/manifest.json \
            --archive "dist/SubscriptionManager_v${RELEASE_VERSION}.zip" \
            --version "$RELEASE_VERSION" \
            --repository "$GITHUB_REPOSITORY" \
            --tag "v$RELEASE_VERSION"

      - name: Publish updated catalog to main
        working-directory: catalog
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish plugin ${{ steps.version.outputs.version }} in catalog"
            git push origin HEAD:main
          fi
